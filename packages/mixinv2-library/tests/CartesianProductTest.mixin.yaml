# Entry point for the Cartesian-product tests: the FFI-free Nat core shown in the
# paper (NatCartesianProductTest, a single {1,2}+{3,4} chain) and the BinNat core,
# composed with the ToPython FFI so the suite can read trie value sets back as
# Python natives via `.pythonValues`, plus the remaining Nat trie combinations
# the paper does not show.
- [NatCartesianProductTest]
- [BinNatCartesianProductTest]
- [Builtin, NatToPython]
- [Builtin, BooleanToPython]
- [Builtin, BinNatToPython]

  # =============================================================================
  # Further Nat trie combinations (not shown in the paper)
  # =============================================================================

  # Zero ∪ Two:  {0, 2}
- NatZeroOrTwo:
    - [CartesianProductTest, ~, Zero]
    - [CartesianProductTest, ~, Two]

  # (Zero ∪ Two) + Three  →  {0+3, 2+3} = {3, 5}
  NatZeroOrTwoPlusThree:
    - [NatZeroOrTwo, Plus]
    - addend: [CartesianProductTest, ~, Three]

  # Three + (One ∪ Two)  →  {3+1, 3+2} = {4, 5}
  NatThreePlusOneOrTwo:
    - [CartesianProductTest, ~, Three, Plus]
    - addend: [CartesianProductTest, ~, NatOneOrTwo]
