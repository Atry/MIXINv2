- [NatConstants]
- [Builtin, NatEqualityZero]
- [Builtin, NatEqualitySuccessor]
- [Builtin, NatPlusZero]
- [Builtin, NatPlusSuccessor]

# One ∪ Two:  {1, 2}
- NatOneOrTwo:
    - [NatCartesianProductTest, ~, One]
    - [NatCartesianProductTest, ~, Two]

# Three ∪ Four:  {3, 4}
- NatThreeOrFour:
    - [NatCartesianProductTest, ~, Three]
    - [NatCartesianProductTest, ~, Four]

# (One ∪ Two) + (Three ∪ Four)  →  {1+3, 1+4, 2+3, 2+4} = {4, 5, 6}
- NatOneOrTwoPlusThreeOrFour:
    - [NatOneOrTwo, Plus]
    - addend: [[NatThreeOrFour]]

# {4,5,6} == {4,5,6}  →  {True, False}  (Cartesian product of equalities)
- NatResultEqualitySelf:
    - [NatOneOrTwoPlusThreeOrFour, sum, Equal]
    - other: [[NatOneOrTwoPlusThreeOrFour, sum]]
