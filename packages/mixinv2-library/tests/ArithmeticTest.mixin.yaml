# Entry point for the Nat arithmetic tests: the FFI-free core shown in the paper
# (NatArithmeticTest, a single 3+4 / (3+4)==7 chain) composed with the ToPython
# FFI so the suite can read results back as Python natives via `.pythonValues`,
# plus the remaining arithmetic / equality cases the paper does not show.
- [NatArithmeticTest]
- [Builtin, NatToPython]
- [Builtin, BooleanToPython]

  # =============================================================================
  # Further addition cases
  # =============================================================================

  # 5 + 2
- fivePlusTwo:
    - [ArithmeticTest, ~, Five, Plus]
    - addend: [ArithmeticTest, ~, Two]

  # 0 + 3
  zeroPlusThree:
    - [ArithmeticTest, ~, Zero, Plus]
    - addend: [ArithmeticTest, ~, Three]

  # =============================================================================
  # Direct equality cases (without addition)
  # =============================================================================

  # 0 == 0
  zeroEqualsZero:
    - [ArithmeticTest, ~, Zero, Equal]
    - other: [ArithmeticTest, ~, Zero]

  # 3 == 3
  threeEqualsThree:
    - [ArithmeticTest, ~, Three, Equal]
    - other: [ArithmeticTest, ~, Three]

  # 3 == 4
  threeEqualsFour:
    - [ArithmeticTest, ~, Three, Equal]
    - other: [ArithmeticTest, ~, Four]

  # =============================================================================
  # Equality cases on addition results
  # =============================================================================

  # (5 + 2) == 7
  fivePlusTwoEqualsSeven:
    - [ArithmeticTest, ~, Seven, Equal]
    - other: [fivePlusTwo, sum]

  # (5 + 2) == 2
  fivePlusTwoEqualsTwo:
    - [ArithmeticTest, ~, Two, Equal]
    - other: [fivePlusTwo, sum]

  # (0 + 3) == 3
  zeroPlusThreeEqualsThree:
    - [ArithmeticTest, ~, Three, Equal]
    - other: [zeroPlusThree, sum]
