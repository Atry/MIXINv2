# Datalog three-way join (rule with 3 body atoms).
#
# Facts:
#   alpha(a,b).
#   alpha(c,b).
#   beta(b,a).
#   beta(b,c).
#   gamma(a,b).
#   gamma(c,a).
#
# Rule:
#   chain(X,W) :- alpha(X,Y), beta(Y,Z), gamma(Z,W).
#
# Expected chain (Datalog-correct):
#   alpha(a,b) + beta(b,a) + gamma(a,b) → chain(a,b)
#   alpha(a,b) + beta(b,c) + gamma(c,a) → chain(a,a)
#   alpha(c,b) + beta(b,a) + gamma(a,b) → chain(c,b)
#   alpha(c,b) + beta(b,c) + gamma(c,a) → chain(c,a)
#   Result: {(a,a), (a,b), (c,a), (c,b)}
#
# This encoding uses repeated __Acceptance/__Visitor pattern for
# value-level joins on Y and Z, producing exact Datalog semantics.

- __Relation:
    __Acceptance:
      __VisitorMap: []
      __Visitor:
        __Visited: []
      __Accepted: []

- __Nil:
    - [__Relation]
    - __Acceptance:
        __VisitorMap:
          __Nil: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, __Nil, __Visited]
- __Cons:
    - [__Relation]
    - __Tail:
        - [__Relation]
        - __Replacement:
            __NewTail: [__Relation]
            __Replaced:
              - [__Cons]
              - __TailMap: []

- a:
    - [__Cons]
    - __Tail: []
      __TailMap:
        a:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalThreeWayJoin, ~, a]
                - __TailMap:
                    a: [__NewTail]
      __WithVisitorTail:
        a:
          __VisitorTail: [__TailMap, a]
      __WithVisiteeTail:
        a:
          __VisiteeTail: [__TailMap, a]
      __Acceptance:
        - __Visitor:
            __Visited: []
          __VisitorMap:
            - a: [__Visitor]
          __Accepted: [__Acceptance, ~, __VisitorMap, a, __Visited]
- b:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        b:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalThreeWayJoin, ~, b]
                - __TailMap:
                    b: [__NewTail]
      __WithVisitorTail:
        b:
          __VisitorTail: [__TailMap, b]
      __WithVisiteeTail:
        b:
          __VisiteeTail: [__TailMap, b]
      __Acceptance:
        __VisitorMap:
          b: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, b, __Visited]
- c:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        c:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalThreeWayJoin, ~, c]
                - __TailMap:
                    c: [__NewTail]
      __WithVisitorTail:
        c:
          __VisitorTail: [__TailMap, c]
      __WithVisiteeTail:
        c:
          __VisiteeTail: [__TailMap, c]
      __Acceptance:
        __VisitorMap:
          c: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, c, __Visited]

# alpha(a,b).
- alpha:
    - [a]
    - __TailMap:
        a:
          - [RelationalThreeWayJoin, ~, b]
          - __TailMap:
              b: [__Nil]

# alpha(c,b).
- alpha:
    - [c]
    - __TailMap:
        c:
          - [RelationalThreeWayJoin, ~, b]
          - __TailMap:
              b: [__Nil]

# beta(b,a).
- beta:
    - [b]
    - __TailMap:
        b:
          - [RelationalThreeWayJoin, ~, a]
          - __TailMap:
              a: [__Nil]

# beta(b,c).
- beta:
    - [b]
    - __TailMap:
        b:
          - [RelationalThreeWayJoin, ~, c]
          - __TailMap:
              c: [__Nil]

# gamma(a,b).
- gamma:
    - [a]
    - __TailMap:
        a:
          - [RelationalThreeWayJoin, ~, b]
          - __TailMap:
              b: [__Nil]

# gamma(c,a).
- gamma:
    - [c]
    - __TailMap:
        c:
          - [RelationalThreeWayJoin, ~, a]
          - __TailMap:
              a: [__Nil]

# chain(X,W) :- alpha(X,Y), beta(Y,Z), gamma(Z,W).
#
# Three chained joins:
#   1. Iterate alpha's first col to get X
#   2. Y join: alpha's second col against beta's first col
#   3. Z join: beta's second col against gamma's first col
#   4. Iterate gamma's second col to get W
#   5. Construct output (X, W) via __Replacement
- __XAcceptance:
    - [alpha, __Acceptance]
    - __VisitorMap: [alpha, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [alpha, __Tail]
        __X: [__VisiteeTail]
        __YAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap:
              - [beta, __WithVisitorTail]
              - [__X, __WithVisiteeTail]
            __Visitor:
              __VisiteeTail: [__X, __Tail]
              __Y0: [__VisiteeTail]
              __VisitorTail: [beta, __Tail]
              __Y1: [__VisitorTail]
              __NilAcceptance0:
                - [__Y0, __Acceptance]
                - __VisitorMap:
                    - __Nil:
                        __ZAcceptance:
                          - [__Y1, __Acceptance]
                          - __VisitorMap:
                              - [gamma, __WithVisitorTail]
                              - [__Y1, __WithVisiteeTail]
                            __Visitor:
                              __VisiteeTail: [__Y1, __Tail]
                              __Z0: [__VisiteeTail]
                              __VisitorTail: [gamma, __Tail]
                              __Z1: [__VisitorTail]
                              __NilAcceptance1:
                                - [__Z0, __Acceptance]
                                - __VisitorMap:
                                    - __Nil:
                                        __WAcceptance:
                                          - [__Z1, __Acceptance]
                                          - __VisitorMap:
                                              - [__Z1, __WithVisiteeTail]
                                          - __Visitor:
                                              __VisiteeTail: [__Z1, __Tail]
                                              __W: [__VisiteeTail]
                                              __NilAcceptance2:
                                                - [__VisiteeTail, __Acceptance]
                                                - __VisitorMap:
                                                    __Nil:
                                                      __WReplacement:
                                                        - [__W, __Replacement]
                                                        - __NewTail:
                                                            [
                                                              RelationalThreeWayJoin,
                                                              ~,
                                                              __Nil,
                                                            ]
                                                      __XReplacement:
                                                        - [__X, __Replacement]
                                                        - __NewTail: [__WReplacement, __Replaced]
                                                      __Visited: [__XReplacement, __Replaced]
                                              __Visited: [__NilAcceptance2, __Accepted]
                                        __Visited: [__WAcceptance, __Accepted]
                              __Visited: [__NilAcceptance1, __Accepted]
                        __Visited: [__ZAcceptance, __Accepted]
              __Visited: [__NilAcceptance0, __Accepted]
        __Visited: [__YAcceptance, __Accepted]

  chain: [__XAcceptance, __Accepted]
