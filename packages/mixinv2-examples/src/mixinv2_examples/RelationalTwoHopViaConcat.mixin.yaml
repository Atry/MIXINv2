# Datalog join via concat + __Acceptance-based two-hop.
#
# Facts:
#   edge(a,b).
#   edge(b,c).
#   edge(c,a).
#
# Step 1 — Cartesian product (no shared variable):
#   concat(X,Y,Z,W) :- edge(X,Y), edge(Z,W).
#
# Step 2 — Two-hop join via __Acceptance (value-level Y==Z):
#   twoHop(X,W) :- edge(X,Y), edge(Y,W).
#
# Standard Datalog twoHop result:
#   {(a,c), (b,a), (c,b)}
#
# This encoding uses the RepeatedVisitor base (__Relation/__Cons/__Nil/__TailMap)
# with nested __Acceptance/__Replacement for the Cartesian product step.

- __Relation:
    __Acceptance:
      __VisitorMap: []
      __Visitor:
        __Visited: []
      __Accepted: []

- __Nil:
    - [__Relation]
    - __Acceptance:
        __VisitorMap:
          __Nil: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, __Nil, __Visited]
- __Cons:
    - [__Relation]
    - __Tail:
        - [__Relation]
        - __Replacement:
            __NewTail: [__Relation]
            __Replaced:
              - [__Cons]
              - __TailMap: []

- a:
    - [__Cons]
    - __Tail: []
      __TailMap:
        a:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalTwoHopViaConcat, ~, a]
                - __TailMap:
                    a: [__NewTail]
      __WithVisitorTail:
        a:
          __VisitorTail: [__TailMap, a]
      __WithVisiteeTail:
        a:
          __VisiteeTail: [__TailMap, a]
      __Acceptance:
        - __Visitor:
            __Visited: []
          __VisitorMap:
            - a: [__Visitor]
          __Accepted: [__Acceptance, ~, __VisitorMap, a, __Visited]
- b:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        b:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalTwoHopViaConcat, ~, b]
                - __TailMap:
                    b: [__NewTail]
      __WithVisitorTail:
        b:
          __VisitorTail: [__TailMap, b]
      __WithVisiteeTail:
        b:
          __VisiteeTail: [__TailMap, b]
      __Acceptance:
        __VisitorMap:
          b: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, b, __Visited]
- c:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        c:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalTwoHopViaConcat, ~, c]
                - __TailMap:
                    c: [__NewTail]
      __WithVisitorTail:
        c:
          __VisitorTail: [__TailMap, c]
      __WithVisiteeTail:
        c:
          __VisiteeTail: [__TailMap, c]
      __Acceptance:
        __VisitorMap:
          c: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, c, __Visited]

# edge(a,b).
- edge:
    - [a]
    - __TailMap:
        a:
          - [RelationalTwoHopViaConcat, ~, b]
          - __TailMap:
              b: [__Nil]

# edge(b,c).
- edge:
    - [b]
    - __TailMap:
        b:
          - [RelationalTwoHopViaConcat, ~, c]
          - __TailMap:
              c: [__Nil]

# edge(c,a).
- edge:
    - [c]
    - __TailMap:
        c:
          - [RelationalTwoHopViaConcat, ~, a]
          - __TailMap:
              a: [__Nil]

# Step 1: concat(X,Y,Z,W) :- edge(X,Y), edge(Z,W).
#
# Cartesian product via nested __Acceptance/__Replacement:
#   For each (X,Y) in edge, for each (Z,W) in edge,
#   construct (X,Y,Z,W) via 4 nested Replacements.
- __ConcatXAcceptance:
    - [edge, __Acceptance]
    - __VisitorMap: [edge, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [edge, __Tail]
        __X: [__VisiteeTail]
        __ConcatYAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap: [__X, __WithVisiteeTail]
          - __Visitor:
              __VisiteeTail: [__X, __Tail]
              __Y: [__VisiteeTail]
              __NilAcceptance0:
                - [__Y, __Acceptance]
                - __VisitorMap:
                    __Nil:
                      __ConcatZAcceptance:
                        - [edge, __Acceptance]
                        - __VisitorMap: [edge, __WithVisiteeTail]
                        - __Visitor:
                            __VisiteeTail: [edge, __Tail]
                            __Z: [__VisiteeTail]
                            __ConcatWAcceptance:
                              - [__Z, __Acceptance]
                              - __VisitorMap: [__Z, __WithVisiteeTail]
                              - __Visitor:
                                  __VisiteeTail: [__Z, __Tail]
                                  __W: [__VisiteeTail]
                                  __NilAcceptance1:
                                    - [__W, __Acceptance]
                                    - __VisitorMap:
                                        __Nil:
                                          __WReplacement:
                                            - [__W, __Replacement]
                                            - __NewTail:
                                                [
                                                  RelationalTwoHopViaConcat,
                                                  ~,
                                                  __Nil,
                                                ]
                                          __ZReplacement:
                                            - [__Z, __Replacement]
                                            - __NewTail: [__WReplacement, __Replaced]
                                          __YReplacement:
                                            - [__Y, __Replacement]
                                            - __NewTail: [__ZReplacement, __Replaced]
                                          __XReplacement:
                                            - [__X, __Replacement]
                                            - __NewTail: [__YReplacement, __Replaced]
                                          __Visited: [__XReplacement, __Replaced]
                                  __Visited: [__NilAcceptance1, __Accepted]
                            __Visited: [__ConcatWAcceptance, __Accepted]
                      __Visited: [__ConcatZAcceptance, __Accepted]
              __Visited: [__NilAcceptance0, __Accepted]
        __Visited: [__ConcatYAcceptance, __Accepted]

  concat: [__ConcatXAcceptance, __Accepted]

# Step 2: twoHop(X,W) :- edge(X,Y), edge(Y,W).
#
# Standard __Acceptance-based two-hop join:
#   1. X: iterate first column of edge (outer acceptance)
#   2. Y: value-level join — match edge's second column against edge's first column
#   3. W: iterate matched edge's second column
#   4. Output (X, W) via __Replacement

- __XAcceptance:
    - [edge, __Acceptance]
    - __VisitorMap: [edge, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [edge, __Tail]
        __X: [__VisiteeTail]
        __YAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap:
              - [edge, __WithVisitorTail]
              - [__X, __WithVisiteeTail]
            __Visitor:
              __VisiteeTail: [__X, __Tail]
              __Y0: [__VisiteeTail]
              __VisitorTail: [edge, __Tail]
              __Y1: [__VisitorTail]
              __NilAcceptance0:
                - [__Y0, __Acceptance]
                - __VisitorMap:
                    - __Nil:
                        __ZAcceptance:
                          - [__Y1, __Acceptance]
                          - __VisitorMap:
                              - [__Y1, __WithVisiteeTail]
                          - __Visitor:
                              __VisiteeTail: [__Y1, __Tail]
                              __Z: [__VisiteeTail]
                              __NilAcceptance1:
                                - [__VisiteeTail, __Acceptance]
                                - __VisitorMap:
                                    __Nil:
                                      __ZReplacement:
                                        - [__Z, __Replacement]
                                        - __NewTail:
                                            [
                                              RelationalTwoHopViaConcat,
                                              ~,
                                              __Nil,
                                            ]
                                      __XReplacement:
                                        - [__X, __Replacement]
                                        - __NewTail: [__ZReplacement, __Replaced]
                                      __Visited: [__XReplacement, __Replaced]
                              __Visited: [__NilAcceptance1, __Accepted]
                        __Visited: [__ZAcceptance, __Accepted]
              __Visited: [__NilAcceptance0, __Accepted]
        __Visited: [__YAcceptance, __Accepted]

  twoHop: [__XAcceptance, __Accepted]
