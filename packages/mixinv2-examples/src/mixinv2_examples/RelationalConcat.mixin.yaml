# Datalog no-join Cartesian product (4-column output).
#
# Facts:
#   edge(a,b).
#   edge(b,c).
#
# Rule:
#   concat(X,Y,W,Z) :- edge(X,Y), edge(W,Z).
#
# Standard Datalog result (4 tuples):
#   {(a,b,a,b), (a,b,b,c), (b,c,a,b), (b,c,b,c)}
#
# This encoding uses nested __Acceptance/__Replacement to implement
# the Cartesian product without TailAppend.
#
# This encoding uses the RepeatedVisitor base (__Relation/__Cons/__Nil/__TailMap).

- __Relation:
    __Acceptance:
      __VisitorMap: []
      __Visitor:
        __Visited: []
      __Accepted: []

- __Nil:
    - [__Relation]
    - __Acceptance:
        __VisitorMap:
          __Nil: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, __Nil, __Visited]
- __Cons:
    - [__Relation]
    - __Tail:
        - [__Relation]
        - __Replacement:
            __NewTail: [__Relation]
            __Replaced:
              - [__Cons]
              - __TailMap: []

- a:
    - [__Cons]
    - __Tail: []
      __TailMap:
        a:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalConcat, ~, a]
                - __TailMap:
                    a: [__NewTail]
      __WithVisitorTail:
        a:
          __VisitorTail: [__TailMap, a]
      __WithVisiteeTail:
        a:
          __VisiteeTail: [__TailMap, a]
      __Acceptance:
        - __Visitor:
            __Visited: []
          __VisitorMap:
            - a: [__Visitor]
          __Accepted: [__Acceptance, ~, __VisitorMap, a, __Visited]
- b:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        b:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalConcat, ~, b]
                - __TailMap:
                    b: [__NewTail]
      __WithVisitorTail:
        b:
          __VisitorTail: [__TailMap, b]
      __WithVisiteeTail:
        b:
          __VisiteeTail: [__TailMap, b]
      __Acceptance:
        __VisitorMap:
          b: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, b, __Visited]
- c:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        c:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalConcat, ~, c]
                - __TailMap:
                    c: [__NewTail]
      __WithVisitorTail:
        c:
          __VisitorTail: [__TailMap, c]
      __WithVisiteeTail:
        c:
          __VisiteeTail: [__TailMap, c]
      __Acceptance:
        __VisitorMap:
          c: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, c, __Visited]

# edge(a,b).
- edge:
    - [a]
    - __TailMap:
        a:
          - [RelationalConcat, ~, b]
          - __TailMap:
              b: [__Nil]

# edge(b,c).
- edge:
    - [b]
    - __TailMap:
        b:
          - [RelationalConcat, ~, c]
          - __TailMap:
              c: [__Nil]

# concat(X,Y,W,Z) :- edge(X,Y), edge(W,Z).
#
# Cartesian product via nested __Acceptance:
#   1. Iterate X from edge (outer acceptance)
#   2. Iterate Y from edge(X,...) (second column)
#   3. Confirm edge(X,Y) ends with __Nil
#   4. On __Nil: iterate W from edge (independent second iteration)
#   5. Iterate Z from edge(W,...) (fourth column)
#   6. Confirm edge(W,Z) ends with __Nil
#   7. Construct output (X,Y,W,Z) via 4 nested Replacements

- __XAcceptance:
    - [edge, __Acceptance]
    - __VisitorMap: [edge, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [edge, __Tail]
        __X: [__VisiteeTail]
        __YAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap: [__X, __WithVisiteeTail]
          - __Visitor:
              __VisiteeTail: [__X, __Tail]
              __Y: [__VisiteeTail]
              __NilAcceptance0:
                - [__Y, __Acceptance]
                - __VisitorMap:
                    __Nil:
                      __WAcceptance:
                        - [edge, __Acceptance]
                        - __VisitorMap: [edge, __WithVisiteeTail]
                        - __Visitor:
                            __VisiteeTail: [edge, __Tail]
                            __W: [__VisiteeTail]
                            __ZAcceptance:
                              - [__W, __Acceptance]
                              - __VisitorMap: [__W, __WithVisiteeTail]
                              - __Visitor:
                                  __VisiteeTail: [__W, __Tail]
                                  __Z: [__VisiteeTail]
                                  __NilAcceptance1:
                                    - [__Z, __Acceptance]
                                    - __VisitorMap:
                                        __Nil:
                                          __ZReplacement:
                                            - [__Z, __Replacement]
                                            - __NewTail:
                                                [
                                                  RelationalConcat,
                                                  ~,
                                                  __Nil,
                                                ]
                                          __WReplacement:
                                            - [__W, __Replacement]
                                            - __NewTail: [__ZReplacement, __Replaced]
                                          __YReplacement:
                                            - [__Y, __Replacement]
                                            - __NewTail: [__WReplacement, __Replaced]
                                          __XReplacement:
                                            - [__X, __Replacement]
                                            - __NewTail: [__YReplacement, __Replaced]
                                          __Visited: [__XReplacement, __Replaced]
                                  __Visited: [__NilAcceptance1, __Accepted]
                            __Visited: [__ZAcceptance, __Accepted]
                      __Visited: [__WAcceptance, __Accepted]
              __Visited: [__NilAcceptance0, __Accepted]
        __Visited: [__YAcceptance, __Accepted]

  concat: [__XAcceptance, __Accepted]
