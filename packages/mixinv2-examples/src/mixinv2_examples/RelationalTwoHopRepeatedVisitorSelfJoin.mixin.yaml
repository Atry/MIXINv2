# Self-join counterexample for repeated __Visitor pattern.
#
# edge = {(a,b), (b,a)}
#
# Datalog: twoHop(X,Z) := edge(X,Y), edge(Y,Z).
#   Y=b: edge(a,b), edge(b,a) -> twoHop(a,a)
#   Y=a: edge(b,a), edge(a,b) -> twoHop(b,b)
#   Datalog result: {(a,a), (b,b)} -- 2 pairs
#
# The old VisitorMapFactory approach over-approximates to 4 pairs.
# This file tests whether the repeated __Visitor approach is exact.

- __Relation:
    __Acceptance:
      __VisitorMap: []
      __Visitor:
        __Visited: []
      __Accepted: []
    
- __Nil:
    - [__Relation]
    - 
      __Acceptance:
        __VisitorMap:
          __Nil: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, __Nil, __Visited]
- __Cons:
    - [__Relation]
    - __Tail:
        - [__Relation]
        - __Replacement:
            __NewTail: [__Relation]
            __Replaced:
              - [__Cons]
              - __TailMap: []

- a:
    - [__Cons]
    - __Tail: []
      __TailMap:
        a:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalTwoHopRepeatedVisitorSelfJoin, ~, a]
                - __TailMap:
                    a: [__NewTail]
      __WithVisitorTail:
        a:
          __VisitorTail: [__TailMap, a]
      __WithVisiteeTail:
        a:
          __VisiteeTail: [__TailMap, a]
      __Acceptance:
        - __Visitor:
            __Visited: []
          __VisitorMap:
            - a: [__Visitor]
          __Accepted: [__Acceptance, ~, __VisitorMap, a, __Visited]
- b:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        b:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalTwoHopRepeatedVisitorSelfJoin, ~, b]
                - __TailMap:
                    b: [__NewTail]
      __WithVisitorTail:
        b:
          __VisitorTail: [__TailMap, b]
      __WithVisiteeTail:
        b:
          __VisiteeTail: [__TailMap, b]
      __Acceptance:
        __VisitorMap:
          b: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, b, __Visited]

# edge(a,b).
- edge:
    - [a]
    - __TailMap:
        a:
          - [RelationalTwoHopRepeatedVisitorSelfJoin, ~, b]
          - __TailMap:
              b: [__Nil]

# edge(b,a).
- edge:
    - [b]
    - __TailMap:
        b:
          - [RelationalTwoHopRepeatedVisitorSelfJoin, ~, a]
          - __TailMap:
              a: [__Nil]

# twoHop(X,Z) := edge(X,Y), edge(Y,Z).
- __XAcceptance:
    - [edge, __Acceptance]
    - __VisitorMap: [edge, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [edge, __Tail]
        __X: [__VisiteeTail]
        __YAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap:
              - [edge, __WithVisitorTail]
              - [__X, __WithVisiteeTail]
            __Visitor:
              __VisiteeTail: [__X, __Tail]
              __Y0: [__VisiteeTail]
              __VisitorTail: [edge, __Tail]
              __Y1: [__VisitorTail]
              __NilAcceptance0:
                - [__Y0, __Acceptance]
                - __VisitorMap:
                    - __Nil:
                        __ZAcceptance:
                          - [__Y1, __Acceptance]
                          - __VisitorMap:
                              - [__Y1, __WithVisiteeTail]
                          - __Visitor:
                              __VisiteeTail: [__Y1, __Tail]
                              __Z: [__VisiteeTail]
                              __NilAcceptance1:
                                - [__VisiteeTail, __Acceptance]
                                - __VisitorMap:
                                    __Nil:
                                      __ZReplacement:
                                        - [__Z, __Replacement]
                                        - __NewTail:
                                            [
                                              RelationalTwoHopRepeatedVisitorSelfJoin,
                                              ~,
                                              __Nil,
                                            ]
                                      __XReplacement:
                                        - [__X, __Replacement]
                                        - __NewTail: [__ZReplacement, __Replaced]
                                      __Visited: [__XReplacement, __Replaced]
                              __Visited: [__NilAcceptance1, __Accepted]
                        __Visited: [__ZAcceptance, __Accepted]
              __Visited: [__NilAcceptance0, __Accepted]
        __Visited: [__YAcceptance, __Accepted]

  twoHop: [__XAcceptance, __Accepted]
