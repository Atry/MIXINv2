# Datalog rule joining two relations on MULTIPLE variables.
#
# Facts:
#   r(a,b).
#   r(b,c).
#   s(a,c).
#   s(b,a).
#
# Rule:
#   multiJoin(X,Y) :- r(X,Y), s(X,Y).
#
# This rule joins r and s on TWO variables simultaneously:
#   - X shared between r's first column and s's first column
#   - Y shared between r's second column and s's second column
#
# Standard Datalog intersection r ∩ s = {} (no common tuples).
#
# With RepeatedVisitor value-level join:
#   X join: r's first col against s's first col (value-level match)
#   Y join: r's second col against s's second col (value-level match)
#   Output: matched (X, Y) pairs reconstructed via __Replacement
#
# Since r and s share no common (X,Y) tuples, the result is empty.
#
# This encoding uses repeated __Acceptance/__Visitor pattern for
# value-level joins, producing exact Datalog semantics.

- __Relation:
    __Acceptance:
      __VisitorMap: []
      __Visitor:
        __Visited: []
      __Accepted: []

- __Nil:
    - [__Relation]
    - __Acceptance:
        __VisitorMap:
          __Nil: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, __Nil, __Visited]
- __Cons:
    - [__Relation]
    - __Tail:
        - [__Relation]
        - __Replacement:
            __NewTail: [__Relation]
            __Replaced:
              - [__Cons]
              - __TailMap: []

- a:
    - [__Cons]
    - __Tail: []
      __TailMap:
        a:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalMultiVariableJoin, ~, a]
                - __TailMap:
                    a: [__NewTail]
      __WithVisitorTail:
        a:
          __VisitorTail: [__TailMap, a]
      __WithVisiteeTail:
        a:
          __VisiteeTail: [__TailMap, a]
      __Acceptance:
        - __Visitor:
            __Visited: []
          __VisitorMap:
            - a: [__Visitor]
          __Accepted: [__Acceptance, ~, __VisitorMap, a, __Visited]
- b:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        b:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalMultiVariableJoin, ~, b]
                - __TailMap:
                    b: [__NewTail]
      __WithVisitorTail:
        b:
          __VisitorTail: [__TailMap, b]
      __WithVisiteeTail:
        b:
          __VisiteeTail: [__TailMap, b]
      __Acceptance:
        __VisitorMap:
          b: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, b, __Visited]
- c:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        c:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalMultiVariableJoin, ~, c]
                - __TailMap:
                    c: [__NewTail]
      __WithVisitorTail:
        c:
          __VisitorTail: [__TailMap, c]
      __WithVisiteeTail:
        c:
          __VisiteeTail: [__TailMap, c]
      __Acceptance:
        __VisitorMap:
          c: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, c, __Visited]

# r(a,b).
- r:
    - [a]
    - __TailMap:
        a:
          - [RelationalMultiVariableJoin, ~, b]
          - __TailMap:
              b: [__Nil]

# r(b,c).
- r:
    - [b]
    - __TailMap:
        b:
          - [RelationalMultiVariableJoin, ~, c]
          - __TailMap:
              c: [__Nil]

# s(a,c).
- s:
    - [a]
    - __TailMap:
        a:
          - [RelationalMultiVariableJoin, ~, c]
          - __TailMap:
              c: [__Nil]

# s(b,a).
- s:
    - [b]
    - __TailMap:
        b:
          - [RelationalMultiVariableJoin, ~, a]
          - __TailMap:
              a: [__Nil]

# multiJoin(X,Y) :- r(X,Y), s(X,Y).
#
# Two chained value-level joins:
#   1. X join: r's first col against s's first col
#   2. Y join: r's second col against s's second col
#   On both matches, construct output (X, Y) via __Replacement
- __XAcceptance:
    - [r, __Acceptance]
    - __VisitorMap:
        - [s, __WithVisitorTail]
        - [r, __WithVisiteeTail]
      __Visitor:
        __VisiteeTail: [r, __Tail]
        __X0: [__VisiteeTail]
        __VisitorTail: [s, __Tail]
        __X1: [__VisitorTail]
        __YAcceptance:
          - [__X0, __Acceptance]
          - __VisitorMap:
              - [__X1, __WithVisitorTail]
              - [__X0, __WithVisiteeTail]
            __Visitor:
              __VisiteeTail: [__X0, __Tail]
              __Y0: [__VisiteeTail]
              __VisitorTail: [__X1, __Tail]
              __Y1: [__VisitorTail]
              __NilAcceptance0:
                - [__Y0, __Acceptance]
                - __VisitorMap:
                    - __Nil:
                        __NilAcceptance1:
                          - [__Y1, __Acceptance]
                          - __VisitorMap:
                              __Nil:
                                __YReplacement:
                                  - [__Y0, __Replacement]
                                  - __NewTail:
                                      [
                                        RelationalMultiVariableJoin,
                                        ~,
                                        __Nil,
                                      ]
                                __XReplacement:
                                  - [__X0, __Replacement]
                                  - __NewTail: [__YReplacement, __Replaced]
                                __Visited: [__XReplacement, __Replaced]
                        __Visited: [__NilAcceptance1, __Accepted]
              __Visited: [__NilAcceptance0, __Accepted]
        __Visited: [__YAcceptance, __Accepted]

  multiJoin: [__XAcceptance, __Accepted]
