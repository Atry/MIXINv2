# Datalog transitive closure on a graph with a single self-loop.
#
# Graph: a → a
#
# Facts:
#   edge(a,a).
#
# Rules:
#   path(X,Y) :- edge(X,Y).
#   path(X,Y) :- edge(X,Z), path(Z,Y).
#
# Expected path:
#   {(a,a)}
#
# This tests the degenerate case where the only edge is a self-loop.
# The recursive rule path(a,Y) :- edge(a,a), path(a,Y) reproduces
# only what the base case already provides, so the fixpoint is trivial.
#
# This encoding uses the RepeatedVisitor base (__Relation/__Cons/__Nil/__TailMap).

- __Relation:
    __Acceptance:
      __VisitorMap: []
      __Visitor:
        __Visited: []
      __Accepted: []

- __Nil:
    - [__Relation]
    - __Acceptance:
        __VisitorMap:
          __Nil: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, __Nil, __Visited]
- __Cons:
    - [__Relation]
    - __Tail:
        - [__Relation]
        - __Replacement:
            __NewTail: [__Relation]
            __Replaced:
              - [__Cons]
              - __TailMap: []
                __WithVisitorTail: []

- a:
    - [__Cons]
    - __Tail: []
      __TailMap:
        a:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalSelfLoop, ~, a]
                - __TailMap:
                    a: [__NewTail]
      __WithVisitorTail:
        a:
          __VisitorTail: [__TailMap, a]
      __WithVisiteeTail:
        a:
          __VisiteeTail: [__TailMap, a]
      __Acceptance:
        - __Visitor:
            __Visited: []
          __VisitorMap:
            - a: [__Visitor]
          __Accepted: [__Acceptance, ~, __VisitorMap, a, __Visited]
- b:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        b:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalSelfLoop, ~, b]
                - __TailMap:
                    b: [__NewTail]
      __WithVisitorTail:
        b:
          __VisitorTail: [__TailMap, b]
      __WithVisiteeTail:
        b:
          __VisiteeTail: [__TailMap, b]
      __Acceptance:
        __VisitorMap:
          b: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, b, __Visited]
- c:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        c:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalSelfLoop, ~, c]
                - __TailMap:
                    c: [__NewTail]
      __WithVisitorTail:
        c:
          __VisitorTail: [__TailMap, c]
      __WithVisiteeTail:
        c:
          __VisiteeTail: [__TailMap, c]
      __Acceptance:
        __VisitorMap:
          c: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, c, __Visited]

# edge(a,a).
- edge:
    - [a]
    - __TailMap:
        a:
          - [RelationalSelfLoop, ~, a]
          - __TailMap:
              a: [__Nil]

# path(X,Y) :- edge(X,Y).
- __BaseXAcceptance:
    - [edge, __Acceptance]
    - __VisitorMap: [edge, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [edge, __Tail]
        __X: [__VisiteeTail]
        __YAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap: [__X, __WithVisiteeTail]
          - __Visitor:
              __VisiteeTail: [__X, __Tail]
              __Y: [__VisiteeTail]
              __NilAcceptance:
                - [__VisiteeTail, __Acceptance]
                - __VisitorMap:
                    __Nil:
                      __YReplacement:
                        - [__Y, __Replacement]
                        - __NewTail: [RelationalSelfLoop, ~, __Nil]
                      __XReplacement:
                        - [__X, __Replacement]
                        - __NewTail: [__YReplacement, __Replaced]
                      __Visited: [__XReplacement, __Replaced]
              __Visited: [__NilAcceptance, __Accepted]
        __Visited: [__YAcceptance, __Accepted]

  path: [__BaseXAcceptance, __Accepted]

# path(X,Y) :- edge(X,Z), path(Z,Y).
- __RecursiveXAcceptance:
    - [edge, __Acceptance]
    - __VisitorMap: [edge, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [edge, __Tail]
        __X: [__VisiteeTail]
        __ZAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap:
              - [path, __WithVisitorTail]
              - [__X, __WithVisiteeTail]
            __Visitor:
              __VisiteeTail: [__X, __Tail]
              __Z0: [__VisiteeTail]
              __VisitorTail: [path, __Tail]
              __NilAcceptance0:
                - [__Z0, __Acceptance]
                - __VisitorMap:
                    - __Nil:
                        __YAcceptance:
                          - [__VisitorTail, __Acceptance]
                          - __VisitorMap:
                              - [__VisitorTail, __WithVisiteeTail]
                          - __Visitor:
                              __VisiteeTail: [__VisitorTail, __Tail]
                              __Y: [__VisiteeTail]
                              __NilAcceptance1:
                                - [__VisiteeTail, __Acceptance]
                                - __VisitorMap:
                                    __Nil:
                                      __YReplacement:
                                        - [__Y, __Replacement]
                                        - __NewTail:
                                            [
                                              RelationalSelfLoop,
                                              ~,
                                              __Nil,
                                            ]
                                      __XReplacement:
                                        - [__X, __Replacement]
                                        - __NewTail: [__YReplacement, __Replaced]
                                      __Visited: [__XReplacement, __Replaced]
                              __Visited: [__NilAcceptance1, __Accepted]
                        __Visited: [__YAcceptance, __Accepted]
              __Visited: [__NilAcceptance0, __Accepted]
        __Visited: [__ZAcceptance, __Accepted]

  path: [__RecursiveXAcceptance, __Accepted]
