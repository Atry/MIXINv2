# Datalog relation composition (join of two different relations).
#
# Facts:
#   alpha(a,b).
#   alpha(c,b).
#   beta(b,a).
#   beta(b,c).
#
# Rule:
#   composed(X,Z) :- alpha(X,Y), beta(Y,Z).
#
# Expected composed (Datalog-correct):
#   {(a,a), (a,c), (c,a), (c,c)}
#
# Derivation:
#   alpha(a,b) + beta(b,a) → composed(a,a)
#   alpha(a,b) + beta(b,c) → composed(a,c)
#   alpha(c,b) + beta(b,a) → composed(c,a)
#   alpha(c,b) + beta(b,c) → composed(c,c)
#
# This encoding uses repeated __Acceptance/__Visitor pattern for
# value-level join on Y, producing exact Datalog semantics.

- __Relation:
    __Acceptance:
      __VisitorMap: []
      __Visitor:
        __Visited: []
      __Accepted: []
    
- __Nil:
    - [__Relation]
    - 
      __Acceptance:
        __VisitorMap:
          __Nil: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, __Nil, __Visited]
- __Cons:
    - [__Relation]
    - __Tail:
        - [__Relation]
        - __Replacement:
            __NewTail: [__Relation]
            __Replaced:
              - [__Cons]
              - __TailMap: []

- a:
    - [__Cons]
    - __Tail: []
      __TailMap:
        a:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalComposition, ~, a]
                - __TailMap:
                    a: [__NewTail]
      __WithVisitorTail:
        a:
          __VisitorTail: [__TailMap, a]
      __WithVisiteeTail:
        a:
          __VisiteeTail: [__TailMap, a]
      __Acceptance:
        - __Visitor:
            __Visited: []
          __VisitorMap:
            - a: [__Visitor]
          __Accepted: [__Acceptance, ~, __VisitorMap, a, __Visited]
- b:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        b:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalComposition, ~, b]
                - __TailMap:
                    b: [__NewTail]
      __WithVisitorTail:
        b:
          __VisitorTail: [__TailMap, b]
      __WithVisiteeTail:
        b:
          __VisiteeTail: [__TailMap, b]
      __Acceptance:
        __VisitorMap:
          b: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, b, __Visited]
- c:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        c:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalComposition, ~, c]
                - __TailMap:
                    c: [__NewTail]
      __WithVisitorTail:
        c:
          __VisitorTail: [__TailMap, c]
      __WithVisiteeTail:
        c:
          __VisiteeTail: [__TailMap, c]
      __Acceptance:
        __VisitorMap:
          c: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, c, __Visited]

# alpha(a,b).
- alpha:
    - [a]
    - __TailMap:
        a:
          - [RelationalComposition, ~, b]
          - __TailMap:
              b: [__Nil]

# alpha(c,b).
- alpha:
    - [c]
    - __TailMap:
        c:
          - [RelationalComposition, ~, b]
          - __TailMap:
              b: [__Nil]

# beta(b,a).
- beta:
    - [b]
    - __TailMap:
        b:
          - [RelationalComposition, ~, a]
          - __TailMap:
              a: [__Nil]

# beta(b,c).
- beta:
    - [b]
    - __TailMap:
        b:
          - [RelationalComposition, ~, c]
          - __TailMap:
              c: [__Nil]

# composed(X,Z) :- alpha(X,Y), beta(Y,Z).
#
# Join alpha and beta on Y:
#   - Visitee: alpha (iterate alpha's first column to get X)
#   - __Visitor: beta (iterate beta's first column, match Y)
#   - On Y match: extract Z from beta, construct output (X, Z)
- __XAcceptance:
    - [alpha, __Acceptance]
    - __VisitorMap: [alpha, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [alpha, __Tail]
        __X: [__VisiteeTail]
        __YAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap:
              - [beta, __WithVisitorTail]
              - [__X, __WithVisiteeTail]
            __Visitor:
              __VisiteeTail: [__X, __Tail]
              __Y0: [__VisiteeTail]
              __VisitorTail: [beta, __Tail]
              __Y1: [__VisitorTail]
              __NilAcceptance0:
                - [__Y0, __Acceptance]
                - __VisitorMap:
                    - __Nil:
                        __ZAcceptance:
                          - [__Y1, __Acceptance]
                          - __VisitorMap:
                              - [__Y1, __WithVisiteeTail]
                          - __Visitor:
                              __VisiteeTail: [__Y1, __Tail]
                              __Z: [__VisiteeTail]
                              __NilAcceptance1:
                                - [__VisiteeTail, __Acceptance]
                                - __VisitorMap:
                                    __Nil:
                                      __ZReplacement:
                                        - [__Z, __Replacement]
                                        - __NewTail:
                                            [
                                              RelationalComposition,
                                              ~,
                                              __Nil,
                                            ]
                                      __XReplacement:
                                        - [__X, __Replacement]
                                        - __NewTail: [__ZReplacement, __Replaced]
                                      __Visited: [__XReplacement, __Replaced]
                              __Visited: [__NilAcceptance1, __Accepted]
                        __Visited: [__ZAcceptance, __Accepted]
              __Visited: [__NilAcceptance0, __Accepted]
        __Visited: [__YAcceptance, __Accepted]

  composed: [__XAcceptance, __Accepted]
