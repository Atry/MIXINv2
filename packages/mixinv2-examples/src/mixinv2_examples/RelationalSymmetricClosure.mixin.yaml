# Datalog symmetric closure via column swap.
#
# Graph: a → b, b → c (directed linear chain)
#
# Facts:
#   edge(a,b).
#   edge(b,c).
#
# Rules:
#   sym(X,Y) :- edge(X,Y).
#   sym(X,Y) :- edge(Y,X).
#
# Expected sym (Datalog-correct):
#   direct: {(a,b), (b,c)}
#   swap:   {(b,a), (c,b)}
#   union:  {(a,b), (b,a), (b,c), (c,b)}
#
# This encoding uses repeated __Acceptance/__Visitor pattern.

- __Relation:
    __Acceptance:
      __VisitorMap: []
      __Visitor:
        __Visited: []
      __Accepted: []

- __Nil:
    - [__Relation]
    - __Acceptance:
        __VisitorMap:
          __Nil: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, __Nil, __Visited]
- __Cons:
    - [__Relation]
    - __Tail:
        - [__Relation]
        - __Replacement:
            __NewTail: [__Relation]
            __Replaced:
              - [__Cons]
              - __TailMap: []

- a:
    - [__Cons]
    - __Tail: []
      __TailMap:
        a:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalSymmetricClosure, ~, a]
                - __TailMap:
                    a: [__NewTail]
      __WithVisitorTail:
        a:
          __VisitorTail: [__TailMap, a]
      __WithVisiteeTail:
        a:
          __VisiteeTail: [__TailMap, a]
      __Acceptance:
        - __Visitor:
            __Visited: []
          __VisitorMap:
            - a: [__Visitor]
          __Accepted: [__Acceptance, ~, __VisitorMap, a, __Visited]
- b:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        b:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalSymmetricClosure, ~, b]
                - __TailMap:
                    b: [__NewTail]
      __WithVisitorTail:
        b:
          __VisitorTail: [__TailMap, b]
      __WithVisiteeTail:
        b:
          __VisiteeTail: [__TailMap, b]
      __Acceptance:
        __VisitorMap:
          b: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, b, __Visited]
- c:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        c:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalSymmetricClosure, ~, c]
                - __TailMap:
                    c: [__NewTail]
      __WithVisitorTail:
        c:
          __VisitorTail: [__TailMap, c]
      __WithVisiteeTail:
        c:
          __VisiteeTail: [__TailMap, c]
      __Acceptance:
        __VisitorMap:
          c: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, c, __Visited]

# edge(a,b).
- edge:
    - [a]
    - __TailMap:
        a:
          - [RelationalSymmetricClosure, ~, b]
          - __TailMap:
              b: [__Nil]

# edge(b,c).
- edge:
    - [b]
    - __TailMap:
        b:
          - [RelationalSymmetricClosure, ~, c]
          - __TailMap:
              c: [__Nil]

# sym(X,Y) :- edge(X,Y).  (direct copy)
#
# Iterate edge: for each X, for each Y in X's tail, construct (X, Y).
# No join — just iterate and reconstruct using __Replacement.
- __DirectXAcceptance:
    - [edge, __Acceptance]
    - __VisitorMap: [edge, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [edge, __Tail]
        __X: [__VisiteeTail]
        __YAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap: [__X, __WithVisiteeTail]
          - __Visitor:
              __VisiteeTail: [__X, __Tail]
              __Y: [__VisiteeTail]
              __NilAcceptance:
                - [__Y, __Acceptance]
                - __VisitorMap:
                    __Nil:
                      __YReplacement:
                        - [__Y, __Replacement]
                        - __NewTail: [RelationalSymmetricClosure, ~, __Nil]
                      __XReplacement:
                        - [__X, __Replacement]
                        - __NewTail: [__YReplacement, __Replaced]
                      __Visited: [__XReplacement, __Replaced]
              __Visited: [__NilAcceptance, __Accepted]
        __Visited: [__YAcceptance, __Accepted]

  sym: [__DirectXAcceptance, __Accepted]

# sym(X,Y) :- edge(Y,X).  (column swap)
#
# Iterate edge as (Y, X): for each Y (edge's first col),
# for each X (edge's second col), construct output (X, Y) — swapped.
- __SwapYAcceptance:
    - [edge, __Acceptance]
    - __VisitorMap: [edge, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [edge, __Tail]
        __SwapY: [__VisiteeTail]
        __SwapXAcceptance:
          - [__SwapY, __Acceptance]
          - __VisitorMap: [__SwapY, __WithVisiteeTail]
          - __Visitor:
              __VisiteeTail: [__SwapY, __Tail]
              __SwapX: [__VisiteeTail]
              __SwapNilAcceptance:
                - [__SwapX, __Acceptance]
                - __VisitorMap:
                    __Nil:
                      # Construct (X, Y) — note the swap: X from second col, Y from first
                      __SwapYReplacement:
                        - [__SwapY, __Replacement]
                        - __NewTail: [RelationalSymmetricClosure, ~, __Nil]
                      __SwapXReplacement:
                        - [__SwapX, __Replacement]
                        - __NewTail: [__SwapYReplacement, __Replaced]
                      __Visited: [__SwapXReplacement, __Replaced]
              __Visited: [__SwapNilAcceptance, __Accepted]
        __Visited: [__SwapXAcceptance, __Accepted]

  sym: [__SwapYAcceptance, __Accepted]
