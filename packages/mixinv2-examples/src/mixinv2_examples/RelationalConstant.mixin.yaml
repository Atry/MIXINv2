# Datalog rule with constant matches and variables.
#
# Facts:
#   edge(a,b).
#   edge(b,c).
#
# Rule:
#   viaB(X,Z) :- edge(X,b), edge(b,Z).
#
# This rule uses the CONSTANT b in two positions:
#   - edge(X,b): X is variable, b is constant in second column
#   - edge(b,Z): b is constant in first column, Z is variable
#
# Expected viaB (Datalog-correct):
#   edge(X,b): X ∈ {a} (only edge(a,b) has b in second column)
#   edge(b,Z): Z ∈ {c} (edge(b,c))
#   Output: {(a,c)}
#
# This encoding uses repeated __Acceptance/__Visitor pattern.

- __Relation:
    __Acceptance:
      __VisitorMap: []
      __Visitor:
        __Visited: []
      __Accepted: []

- __Nil:
    - [__Relation]
    -
      __Acceptance:
        __VisitorMap:
          __Nil: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, __Nil, __Visited]
- __Cons:
    - [__Relation]
    - __Tail:
        - [__Relation]
        - __Replacement:
            __NewTail: [__Relation]
            __Replaced:
              - [__Cons]
              - __TailMap: []

- a:
    - [__Cons]
    - __Tail: []
      __TailMap:
        a:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalConstant, ~, a]
                - __TailMap:
                    a: [__NewTail]
      __WithVisitorTail:
        a:
          __VisitorTail: [__TailMap, a]
      __WithVisiteeTail:
        a:
          __VisiteeTail: [__TailMap, a]
      __Acceptance:
        - __Visitor:
            __Visited: []
          __VisitorMap:
            - a: [__Visitor]
          __Accepted: [__Acceptance, ~, __VisitorMap, a, __Visited]
- b:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        b:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalConstant, ~, b]
                - __TailMap:
                    b: [__NewTail]
      __WithVisitorTail:
        b:
          __VisitorTail: [__TailMap, b]
      __WithVisiteeTail:
        b:
          __VisiteeTail: [__TailMap, b]
      __Acceptance:
        __VisitorMap:
          b: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, b, __Visited]
- c:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        c:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalConstant, ~, c]
                - __TailMap:
                    c: [__NewTail]
      __WithVisitorTail:
        c:
          __VisitorTail: [__TailMap, c]
      __WithVisiteeTail:
        c:
          __VisiteeTail: [__TailMap, c]
      __Acceptance:
        __VisitorMap:
          c: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, c, __Visited]

# edge(a,b).
- edge:
    - [a]
    - __TailMap:
        a:
          - [RelationalConstant, ~, b]
          - __TailMap:
              b: [__Nil]

# edge(b,c).
- edge:
    - [b]
    - __TailMap:
        b:
          - [RelationalConstant, ~, c]
          - __TailMap:
              c: [__Nil]

# viaB(X,Z) :- edge(X,b), edge(b,Z).
#
# This is a constant-match join where Y is the constant b.
# 1. Iterate X over edge's first column (outer acceptance)
# 2. For each X, get edge(X,Y) — iterate Y values
# 3. Check Y=b via acceptance with only b in __VisitorMap (constant match)
# 4. On b match, get Z from edge(b,Z) = edge.__TailMap.b
# 5. Construct output (X, Z) via __Replacement

# edge(b,Z) — direct navigation to b's row
- __edgeBTail:
    - [edge, __TailMap, b]

- __XAcceptance:
    - [edge, __Acceptance]
    - __VisitorMap: [edge, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [edge, __Tail]
        __X: [__VisiteeTail]
        __YAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap:
                # Constant match: only b in __VisitorMap
                b:
                  __NilAcceptance0:
                    - [__X, __TailMap, b, __Acceptance]
                    - __VisitorMap:
                        __Nil:
                          # Y=b confirmed, __Nil after b confirmed.
                          # Now iterate Z from edge(b,Z).
                          __ZAcceptance:
                            - [__edgeBTail, __Acceptance]
                            - __VisitorMap: [__edgeBTail, __WithVisiteeTail]
                            - __Visitor:
                                __VisiteeTail: [__edgeBTail, __Tail]
                                __Z: [__VisiteeTail]
                                __NilAcceptance1:
                                  - [__Z, __Acceptance]
                                  - __VisitorMap:
                                      __Nil:
                                        __ZReplacement:
                                          - [__Z, __Replacement]
                                          - __NewTail:
                                              [
                                                RelationalConstant,
                                                ~,
                                                __Nil,
                                              ]
                                        __XReplacement:
                                          - [__X, __Replacement]
                                          - __NewTail: [__ZReplacement, __Replaced]
                                        __Visited: [__XReplacement, __Replaced]
                                __Visited: [__NilAcceptance1, __Accepted]
                          __Visited: [__ZAcceptance, __Accepted]
                  __Visited: [__NilAcceptance0, __Accepted]
        __Visited: [__YAcceptance, __Accepted]

  viaB: [__XAcceptance, __Accepted]
