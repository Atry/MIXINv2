# Datalog rule mixing constant matches and variable joins in a 3-body rule.
#
# Facts:
#   edge(a,b).
#   edge(b,c).
#   edge(c,a).
#
# Rule:
#   constJoin(X,W) :- edge(X,Y), edge(Y,b), edge(b,W).
#
# Datalog-correct derivation:
#   edge(Y,b) means Y's row in edge has b in second col.
#     edge(a,b): Y=a has second col b → match
#     edge(b,c): Y=b has second col c≠b → no match
#     edge(c,a): Y=c has second col a≠b → no match
#   So only Y=a matches. X from edge(X,a): edge(c,a) → X=c
#   edge(b,W): edge(b,c) → W=c
#   Result: {(c,c)}
#
# This encoding uses repeated __Acceptance/__Visitor pattern.

- __Relation:
    __Acceptance:
      __VisitorMap: []
      __Visitor:
        __Visited: []
      __Accepted: []

- __Nil:
    - [__Relation]
    -
      __Acceptance:
        __VisitorMap:
          __Nil: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, __Nil, __Visited]
- __Cons:
    - [__Relation]
    - __Tail:
        - [__Relation]
        - __Replacement:
            __NewTail: [__Relation]
            __Replaced:
              - [__Cons]
              - __TailMap: []

- a:
    - [__Cons]
    - __Tail: []
      __TailMap:
        a:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalConstantJoin, ~, a]
                - __TailMap:
                    a: [__NewTail]
      __WithVisitorTail:
        a:
          __VisitorTail: [__TailMap, a]
      __WithVisiteeTail:
        a:
          __VisiteeTail: [__TailMap, a]
      __Acceptance:
        - __Visitor:
            __Visited: []
          __VisitorMap:
            - a: [__Visitor]
          __Accepted: [__Acceptance, ~, __VisitorMap, a, __Visited]
- b:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        b:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalConstantJoin, ~, b]
                - __TailMap:
                    b: [__NewTail]
      __WithVisitorTail:
        b:
          __VisitorTail: [__TailMap, b]
      __WithVisiteeTail:
        b:
          __VisiteeTail: [__TailMap, b]
      __Acceptance:
        __VisitorMap:
          b: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, b, __Visited]
- c:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        c:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalConstantJoin, ~, c]
                - __TailMap:
                    c: [__NewTail]
      __WithVisitorTail:
        c:
          __VisitorTail: [__TailMap, c]
      __WithVisiteeTail:
        c:
          __VisiteeTail: [__TailMap, c]
      __Acceptance:
        __VisitorMap:
          c: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, c, __Visited]

# edge(a,b).
- edge:
    - [a]
    - __TailMap:
        a:
          - [RelationalConstantJoin, ~, b]
          - __TailMap:
              b: [__Nil]

# edge(b,c).
- edge:
    - [b]
    - __TailMap:
        b:
          - [RelationalConstantJoin, ~, c]
          - __TailMap:
              c: [__Nil]

# edge(c,a).
- edge:
    - [c]
    - __TailMap:
        c:
          - [RelationalConstantJoin, ~, a]
          - __TailMap:
              a: [__Nil]

# constJoin(X,W) :- edge(X,Y), edge(Y,b), edge(b,W).
#
# Three-body rule with constant b:
#   1. Outer acceptance: iterate X over edge1's first column
#   2. Y join: match edge1's Y against edge2's first col (value-level)
#   3. Constant b check: check edge2's second col = b
#   4. W extraction: get W from edge(b,W)
#   5. Construct output (X, W) via __Replacement

# edge(b,W) — direct navigation to b's row in edge
- __edgeBTail:
    - [edge, __TailMap, b]

# Main join
- __XAcceptance:
    - [edge, __Acceptance]
    - __VisitorMap: [edge, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [edge, __Tail]
        __X: [__VisiteeTail]
        __YAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap:
              - [edge, __WithVisitorTail]
              - [__X, __WithVisiteeTail]
            __Visitor:
              __VisiteeTail: [__X, __Tail]
              __Y0: [__VisiteeTail]
              __VisitorTail: [edge, __Tail]
              __Y1: [__VisitorTail]
              # Verify edge1's Y tail is __Nil (single element)
              __NilAcceptance0:
                - [__Y0, __Acceptance]
                - __VisitorMap:
                    - __Nil:
                        # Y confirmed as single element.
                        # Now check edge2(Y,?) has b in second col.
                        __BAcceptance:
                          - [__Y1, __Acceptance]
                          - __VisitorMap:
                                b:
                                  __NilAfterB:
                                    - [__Y1, __TailMap, b, __Acceptance]
                                    - __VisitorMap:
                                        __Nil:
                                          __WAcceptance:
                                            - [__edgeBTail, __Acceptance]
                                            - __VisitorMap: [__edgeBTail, __WithVisiteeTail]
                                            - __Visitor:
                                                __VisiteeTail: [__edgeBTail, __Tail]
                                                __W: [__VisiteeTail]
                                                __NilAcceptanceW:
                                                  - [__W, __Acceptance]
                                                  - __VisitorMap:
                                                      __Nil:
                                                        __WReplacement:
                                                          - [__W, __Replacement]
                                                          - __NewTail:
                                                              [
                                                                RelationalConstantJoin,
                                                                ~,
                                                                __Nil,
                                                              ]
                                                        __XReplacement:
                                                          - [__X, __Replacement]
                                                          - __NewTail: [__WReplacement, __Replaced]
                                                        __Visited: [__XReplacement, __Replaced]
                                                __Visited: [__NilAcceptanceW, __Accepted]
                                          __Visited: [__WAcceptance, __Accepted]
                                  __Visited: [__NilAfterB, __Accepted]
                        __Visited: [__BAcceptance, __Accepted]
              __Visited: [__NilAcceptance0, __Accepted]
        __Visited: [__YAcceptance, __Accepted]

  constJoin: [__XAcceptance, __Accepted]
