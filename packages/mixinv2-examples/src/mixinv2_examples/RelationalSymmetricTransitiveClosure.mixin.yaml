# Datalog symmetric transitive closure (chained/stratified rules).
#
# Graph: a → b → c (directed linear chain)
#
# Facts:
#   edge(a,b).
#   edge(b,c).
#
# Rules (layer 1 — symmetric closure):
#   sym(X,Y) :- edge(X,Y).
#   sym(X,Y) :- edge(Y,X).
#
# Rules (layer 2 — transitive closure of sym):
#   reach(X,Y) :- sym(X,Y).
#   reach(X,Y) :- sym(X,Z), reach(Z,Y).
#
# Expected sym (Datalog-correct — 4 pairs):
#   direct: {(a,b), (b,c)}
#   swap:   {(b,a), (c,b)}
#   union:  {(a,b), (b,a), (b,c), (c,b)}
#
# Expected reach (final — complete graph on {a,b,c}, all 9 pairs):
#   {(a,a), (a,b), (a,c), (b,a), (b,b), (b,c), (c,a), (c,b), (c,c)}
#
# Since sym's first and second columns each cover {a,b,c}, the recursive
# rule fills in all remaining pairs, yielding all 9 pairs.
#
# This tests CHAINED/STRATIFIED RULES: reach depends on sym, which
# depends on edge. It also tests that a derived predicate (sym) can
# be used as input to another derived predicate (reach).
#
# This encoding uses the RepeatedVisitor base (__Relation/__Cons/__Nil/__TailMap).

- __Relation:
    __Acceptance:
      __VisitorMap: []
      __Visitor:
        __Visited: []
      __Accepted: []

- __Nil:
    - [__Relation]
    - __Acceptance:
        __VisitorMap:
          __Nil: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, __Nil, __Visited]
- __Cons:
    - [__Relation]
    - __Tail:
        - [__Relation]
        - __Replacement:
            __NewTail: [__Relation]
            __Replaced:
              - [__Cons]
              - __TailMap: []

- a:
    - [__Cons]
    - __Tail: []
      __TailMap:
        a:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalSymmetricTransitiveClosure, ~, a]
                - __TailMap:
                    a: [__NewTail]
      __WithVisitorTail:
        a:
          __VisitorTail: [__TailMap, a]
      __WithVisiteeTail:
        a:
          __VisiteeTail: [__TailMap, a]
      __Acceptance:
        - __Visitor:
            __Visited: []
          __VisitorMap:
            - a: [__Visitor]
          __Accepted: [__Acceptance, ~, __VisitorMap, a, __Visited]
- b:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        b:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalSymmetricTransitiveClosure, ~, b]
                - __TailMap:
                    b: [__NewTail]
      __WithVisitorTail:
        b:
          __VisitorTail: [__TailMap, b]
      __WithVisiteeTail:
        b:
          __VisiteeTail: [__TailMap, b]
      __Acceptance:
        __VisitorMap:
          b: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, b, __Visited]
- c:
    - [__Cons]
    - __Tail: []
    - __TailMap:
        c:
          - [__Tail]
          - __Replacement:
              __NewTail: [__Tail]
              __Replaced:
                - [RelationalSymmetricTransitiveClosure, ~, c]
                - __TailMap:
                    c: [__NewTail]
      __WithVisitorTail:
        c:
          __VisitorTail: [__TailMap, c]
      __WithVisiteeTail:
        c:
          __VisiteeTail: [__TailMap, c]
      __Acceptance:
        __VisitorMap:
          c: [__Visitor]
        __Visitor:
          __Visited: []
        __Accepted: [__VisitorMap, c, __Visited]

# edge(a,b).
- edge:
    - [a]
    - __TailMap:
        a:
          - [RelationalSymmetricTransitiveClosure, ~, b]
          - __TailMap:
              b: [__Nil]

# edge(b,c).
- edge:
    - [b]
    - __TailMap:
        b:
          - [RelationalSymmetricTransitiveClosure, ~, c]
          - __TailMap:
              c: [__Nil]

# =========================================================================
# Layer 1: sym(X,Y) — symmetric closure of edge
# =========================================================================

# sym(X,Y) :- edge(X,Y).  (direct copy)
- __DirectXAcceptance:
    - [edge, __Acceptance]
    - __VisitorMap: [edge, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [edge, __Tail]
        __X: [__VisiteeTail]
        __YAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap: [__X, __WithVisiteeTail]
          - __Visitor:
              __VisiteeTail: [__X, __Tail]
              __Y: [__VisiteeTail]
              __NilAcceptance:
                - [__Y, __Acceptance]
                - __VisitorMap:
                    __Nil:
                      __YReplacement:
                        - [__Y, __Replacement]
                        - __NewTail:
                            [
                              RelationalSymmetricTransitiveClosure,
                              ~,
                              __Nil,
                            ]
                      __XReplacement:
                        - [__X, __Replacement]
                        - __NewTail: [__YReplacement, __Replaced]
                      __Visited: [__XReplacement, __Replaced]
              __Visited: [__NilAcceptance, __Accepted]
        __Visited: [__YAcceptance, __Accepted]

  sym: [__DirectXAcceptance, __Accepted]

# sym(X,Y) :- edge(Y,X).  (column swap)
- __SwapYAcceptance:
    - [edge, __Acceptance]
    - __VisitorMap: [edge, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [edge, __Tail]
        __SwapY: [__VisiteeTail]
        __SwapXAcceptance:
          - [__SwapY, __Acceptance]
          - __VisitorMap: [__SwapY, __WithVisiteeTail]
          - __Visitor:
              __VisiteeTail: [__SwapY, __Tail]
              __SwapX: [__VisiteeTail]
              __SwapNilAcceptance:
                - [__SwapX, __Acceptance]
                - __VisitorMap:
                    __Nil:
                      __SwapYReplacement:
                        - [__SwapY, __Replacement]
                        - __NewTail:
                            [
                              RelationalSymmetricTransitiveClosure,
                              ~,
                              __Nil,
                            ]
                      __SwapXReplacement:
                        - [__SwapX, __Replacement]
                        - __NewTail: [__SwapYReplacement, __Replaced]
                      __Visited: [__SwapXReplacement, __Replaced]
              __Visited: [__SwapNilAcceptance, __Accepted]
        __Visited: [__SwapXAcceptance, __Accepted]

  sym: [__SwapYAcceptance, __Accepted]

# =========================================================================
# Layer 2: reach(X,Y) — transitive closure of sym
# =========================================================================

# reach(X,Y) :- sym(X,Y).  (base case)
- __BaseXAcceptance:
    - [sym, __Acceptance]
    - __VisitorMap: [sym, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [sym, __Tail]
        __X: [__VisiteeTail]
        __YAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap: [__X, __WithVisiteeTail]
          - __Visitor:
              __VisiteeTail: [__X, __Tail]
              __Y: [__VisiteeTail]
              __NilAcceptance:
                - [__VisiteeTail, __Acceptance]
                - __VisitorMap:
                    __Nil:
                      __YReplacement:
                        - [__Y, __Replacement]
                        - __NewTail:
                            [
                              RelationalSymmetricTransitiveClosure,
                              ~,
                              __Nil,
                            ]
                      __XReplacement:
                        - [__X, __Replacement]
                        - __NewTail: [__YReplacement, __Replaced]
                      __Visited: [__XReplacement, __Replaced]
              __Visited: [__NilAcceptance, __Accepted]
        __Visited: [__YAcceptance, __Accepted]

  reach: [__BaseXAcceptance, __Accepted]

# reach(X,Y) :- sym(X,Z), reach(Z,Y).  (recursive case)
- __RecursiveXAcceptance:
    - [sym, __Acceptance]
    - __VisitorMap: [sym, __WithVisiteeTail]
    - __Visitor:
        __VisiteeTail: [sym, __Tail]
        __X: [__VisiteeTail]
        __ZAcceptance:
          - [__X, __Acceptance]
          - __VisitorMap:
              - [reach, __WithVisitorTail]
              - [__X, __WithVisiteeTail]
            __Visitor:
              __VisiteeTail: [__X, __Tail]
              __Z0: [__VisiteeTail]
              __VisitorTail: [reach, __Tail]
              __NilAcceptance0:
                - [__Z0, __Acceptance]
                - __VisitorMap:
                    - __Nil:
                        __YAcceptance:
                          - [__VisitorTail, __Acceptance]
                          - __VisitorMap:
                              - [__VisitorTail, __WithVisiteeTail]
                          - __Visitor:
                              __VisiteeTail: [__VisitorTail, __Tail]
                              __Y: [__VisiteeTail]
                              __NilAcceptance1:
                                - [__VisiteeTail, __Acceptance]
                                - __VisitorMap:
                                    __Nil:
                                      __YReplacement:
                                        - [__Y, __Replacement]
                                        - __NewTail:
                                            [
                                              RelationalSymmetricTransitiveClosure,
                                              ~,
                                              __Nil,
                                            ]
                                      __XReplacement:
                                        - [__X, __Replacement]
                                        - __NewTail: [__YReplacement, __Replaced]
                                      __Visited: [__XReplacement, __Replaced]
                              __Visited: [__NilAcceptance1, __Accepted]
                        __Visited: [__YAcceptance, __Accepted]
              __Visited: [__NilAcceptance0, __Accepted]
        __Visited: [__ZAcceptance, __Accepted]

  reach: [__RecursiveXAcceptance, __Accepted]
